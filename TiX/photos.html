            position: fixed;

            padding: 15px 25px;
            border-radius: 30px;

            font-size: 1.1rem;

            display: flex;
            align-items: center;
            z-index: 1000;
            animation: fadeInUp 0.5s ease, pulse 2s infinite;
        }

        .nav-hint i {
            margin-right: 10px;
            font-size: 1.4rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, 30px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        @keyframes pulse {
            0% { box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 5px 25px rgba(255, 204, 0, 0.5); }
            100% { box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); }
        }

        .hint-enter {
            animation: fadeInUp 0.5s ease;
        }

        .hint-exit {
            animation: fadeOutDown 0.5s ease forwards;
        }

        @keyframes fadeOutDown {
            from {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            to {
                opacity: 0;
                transform: translate(-50%, 30px);
            }

                // Remove element after animation

                    if (document.body.contains(hint)) {
                        document.body.removeChild(hint);

                }, 500);

        (function optimizeCloudinaryUrls() {
            // Intelligently add compression parameters to all Cloudinary URLs
            chapterConfig.imageUrls = chapterConfig.imageUrls.map(url => {
                if (!url.includes('res.cloudinary.com')) return url; // Keep non-Cloudinary links unchanged
                
                // Check if optimization parameters already exist
                if (url.includes('/f_') || url.includes('/q_')) return url;
                
                // Add optimization parameters after /upload/
                return url.replace(
                    /(https:\/\/res\.cloudinary\.com\/[^/]+\/image\/upload\/)(v\d+\/)/, 
                    '$1f_auto,q_auto/$2'
                );
            });
        })();

            if (entry.isIntersecting) {
                loadImage();
                observer.unobserve(entry.target);
            }
        });
    });
    
    observer.observe(img);
    

    
                
                // Add image loading status listener
                img.onload = function() {
                    this.classList.add('loaded');
                    
                    // Update loading count
                    const loaded = parseInt(loadedCount.textContent) + 1;
                    loadedCount.textContent = loaded;
                    
                    // Update progress bar
                    const progress = Math.floor((loaded / chapterConfig.imageUrls.length) * 100);
                    progressBar.style.width = `${progress}%`;
                    
                    // When all images are loaded
                    if (loaded === chapterConfig.imageUrls.length) {
                        setTimeout(() => {
                            statusBar.innerHTML = '<i class="fas fa-check-circle"></i> All photos loaded successfully!';
                            statusBar.style.color = '#28a745';
                            
                            // Place the last page detection element after all content
                            document.body.appendChild(endIndicator);
                        }, 500);
                    }
                };
                
                img.onerror = function() {
                    this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600"><rect width="400" height="600" fill="%23f8f9fa"/><text x="200" y="300" font-family="Arial" font-size="20" fill="%236c757d" text-anchor="middle">Image failed to load</text></svg>';
                    this.classList.add('loaded');
                    
                    // Update loading count
                    const loaded = parseInt(loadedCount.textContent) + 1;
                    loadedCount.textContent = loaded;
                    
                    // Update progress bar
                    const progress = Math.floor((loaded / chapterConfig.imageUrls.length) * 100);
                    progressBar.style.width = `${progress}%`;
                };
                
                // Add page number label
                const pageNum = document.createElement('div');
                pageNum.className = 'page-number';
                pageNum.textContent = `Photo ${index + 1}`;
                pageNum.style.textAlign = 'center';
                pageNum.style.margin = '5px 0 15px';
                pageNum.style.color = '#6c757d';
                pageNum.style.fontSize = '0.9rem';
                
                imgContainer.appendChild(img);
                imgContainer.appendChild(pageNum);
                comicContainer.appendChild(imgContainer);
            });
            
            // Hide header/footer when scrolling (optimized version)
            window.addEventListener('scroll', function() {
                const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
                const windowHeight = window.innerHeight;
                const documentHeight = Math.max(
                    document.body.scrollHeight, 
                    document.body.offsetHeight, 
                    document.documentElement.clientHeight, 
                    document.documentElement.scrollHeight, 
                    document.documentElement.offsetHeight
                );
                
                // Calculate distance to bottom
                const distanceToBottom = documentHeight - (currentScroll + windowHeight);
                
                // If close to bottom (within 1200 pixels), show all elements
                if (distanceToBottom < 1200) {
                    header.classList.remove('hidden');
                    footer.classList.remove('hidden');
                    statusBarEl.classList.remove('hidden');
                    isNearBottom = true;
                    return;
                } else {
                    isNearBottom = false;
                }
                
                // Hide when scrolling down more than 50px
                if (currentScroll > lastScrollTop && currentScroll > 50) {
                    header.classList.add('hidden');
                    footer.classList.add('hidden');
                    statusBarEl.classList.add('hidden');
                } 
                // Show when scrolling up or at top
                else {
                    header.classList.remove('hidden');
                    footer.classList.remove('hidden');
                    statusBarEl.classList.remove('hidden');
                }
                
                lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
            });
            
            // Click center area to show navigation menu
            document.body.addEventListener('click', function(e) {
                // Exclude button clicks
                if (e.target.closest('.nav-btn')) return;
                
                // Toggle navigation menu display state
                navOverlay.classList.toggle('active');
            });
            
            // Navigation button functions
            prevBtn.addEventListener('click', function() {
                // No previous page, disable
                prevBtn.classList.add('disabled');
            });
            
            homeBtn.addEventListener('click', function() {
                // Navigate to index page
                window.location.href = 'index.html';
            });
            
            nextBtn.addEventListener('click', function() {
                // No next page, disable
                nextBtn.classList.add('disabled');
            });
            
            // Initially hide talk section, show when scrolling to end
            talkSection.style.opacity = '0';
            talkSection.style.transform = 'translateY(20px)';
            talkSection.style.transition = 'all 0.5s ease';
            
            // Show talk section when scrolling to end
            window.addEventListener('scroll', function() {
                const talkSectionRect = talkSection.getBoundingClientRect();
                const windowHeight = window.innerHeight;
                
                // Show when talk section enters viewport
                if (talkSectionRect.top < windowHeight * 0.8) {
                    talkSection.style.opacity = '1';
                    talkSection.style.transform = 'translateY(0)';
                }
            });
        });
    </script>
