<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Washizuka Gaiden - Fan Comic Scene</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: #f0f2f5;
            color: #333333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .page-wrapper {
            margin-bottom: 40px;
        }
        
        .comic-image {
            display: block;
            width: 100%;
            height: auto;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 4px;
        }
        
        .page-note {
            margin: 15px 0 25px;
            color: #666;
            font-size: 1.2rem;
            line-height: 1.8;
            min-height: 60px;
            padding: 0 5px;
            white-space: pre-wrap; /* 添加这一行 */
        }
        
        /* 碎碎念区域样式 - 与原版相同 */
        .talk-section {
            background: #eef7ff;
            border-radius: 10px;
            padding: 25px;
            margin: 40px auto 30px;
            max-width: 800px;
            border-left: 4px solid #4a6fa5;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }
        
        .talk-content {
            line-height: 1.8;
            font-size: 1.2rem;
        }
        
        .talk-content p {
            margin-bottom: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #6c757d;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(74, 111, 165, 0.2);
            border-top: 3px solid #4a6fa5;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .page-wrapper {
                margin-bottom: 30px;
            }
            
            .talk-section {
                padding: 20px;
                margin: 30px 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="comic-container">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>
    
    <script>
        // 漫画配置
        const comicConfig = {
            // 图片URL数组
            imageUrls: [
                "https://res.cloudinary.com/dbulxrm7b/image/upload/v1770483865/14_Page_pxdbrm.png",
                "https://res.cloudinary.com/dbulxrm7b/image/upload/v1770483873/15_Page_j2xbgu.png",
                "https://res.cloudinary.com/dbulxrm7b/image/upload/v1770483871/16_Page_raj0mm.png",
                // 在这里添加更多图片URL
            ],
            
            // 页面注释 - 在这里添加每页的注释
           pageNotes: [
        `In Hayabusa’s original lines, "Honbucho" is given the furigana for "that guy." This means that phonetically, they are calling the Secretary "that guy," while the text lets the reader know exactly who they mean. Interestingly, on Page 16, there’s no furigana, which feels like Hayabusa’s inner thoughts, suggesting he normally thinks of him as "Honbucho."

As for the phrase "裹の仕事, Ura no Shigoto" (Inside work), it refers to Hayabusa’s usual illegal or clandestine duties, standing in direct contrast to the Secretary’s role. Given the emphasis on staying long-term in a mountain village with zero entertainment, the Secretary’s hint is quite blatant. Once that’s clear, the rest makes sense: the Secretary tells Hayabusa that since there’s no fun in the village, Hayabusa has "work" at night (meaning he is the amusement facilities for Washizu) . Both the Secretary and Washizu know exactly what this implies, but Hayabusa is completely clueless until the realization hits him and he runs away in shame. It’s a hilarious dynamic.`,
        `The background of this story is Chapter 26 of the original manga. Although it’s short, this chapter is famous in the Chinese community because it mentions Washizu’s old schoolmates—perfect fuel for shipping. However, the Secretary doesn't appear in the original chapter, so I was a bit confused why Hayabusa mentioned the Secretary "handing over his share of the work" to him. Since the Secretary isn't even there, why would Hayabusa be responsible for Washizu’s "entertainment"? But it’s a minor doubt that doesn’t hinder the overall story.`,
        `Lastly, I’m not sure if you noticed, but the Kyousei Trio all use different first-person pronouns:Hayabusa uses "Ore," a rough, masculine self-reference. His tone is very much like a mobster—blunt and impolite.Washizu uses "Washi," typically used by older men. It fits a 70-year-old, but feels rugged and "old-school" for his 58-year-old self who looks 40. He also seems to have a Kansai-adjacent dialect, which makes him quite hard to understand. But I am not sure about the dialect. By the way, Koshiba uses "Boku," which is typical for boys and feels quite cute.

The language in this manga is very colloquial and character-driven. Since Chinese (much like English) is a concise language without specific words to modify "tone" or "social standing" through grammar alone, it’s quite a challenge to translate these nuances.`
 
 ],
            
            // 碎碎念/后记
            afterword: `
                <p>Actually, I don’t know Japanese. I have to rely on translators or AI to read, which makes it quite an exhausting process, though I truly enjoy it. I haven’t finished the entire doujinshi yet, but I’ve read the pages featuring Jacoman/Honbucho and am dying to see the rest. If possible, could you send the images to my email: <mark>2166498714@qq.com</mark>? It might be easier for us to communicate there as well—AO3 doesn't notify me about replies to my own comments, so unless I check manually, I never know if there are new messages. Also, I’m planning to delete my comments on AO3 later because they feel a bit embarrassing……</p>
                <p>Regarding Page 50, the whole story revolves around Hayabusa’s envy toward the Secretary for being so trusted by Washizu. He tries to mimic the Secretary’s behavior, and the lines leading up to this are all Hayabusa expressing that envy (and perhaps a bit of jealousy), saying that only the Secretary is truly valued. The long monologue that follows is the Secretary explaining why he is trusted:</p>
                <p>"Naturally, I can tie my own tie, drive both boats and cars, and prioritize the safety of my comrades even when I’m in danger. I possess a tough spirit, am admired by subordinates as a General Manager, and am competent and resourceful as a secretary. My reputation as Washizu’s right-hand man is so great that even when kidnapped by a rival company, the President himself came to my rescue because I am that indispensable."</p>
                <p>This exhaustive list is actually a setup for a "BUT"—a transition where he eventually says, "While I can do all this, there are things I can't do that only Hayabusa can." </p>
                <p>Sorry, I just saw your new message! It’s getting pretty late here so I need to head to bed. I'll check it first thing tomorrow morning!~</p>
            `
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('comic-container');
            
            // 移除加载提示
            container.innerHTML = '';
            
            // 创建并添加所有漫画页面
            comicConfig.imageUrls.forEach((url, index) => {
                const pageWrapper = document.createElement('div');
                pageWrapper.className = 'page-wrapper';
                
                // 添加图片
                const img = document.createElement('img');
                img.src = url;
                img.alt = `Page ${index + 1}`;
                img.className = 'comic-image';
                
                // 添加页码
                const pageNum = document.createElement('div');
                pageNum.style.color = '#999';
                pageNum.style.fontSize = '12px';
                pageNum.style.marginBottom = '5px';
                pageNum.textContent = `Page ${index + 1}`;
                
                // 添加注释区域
                const noteDiv = document.createElement('div');
                noteDiv.className = 'page-note';
                
                // 如果有预设注释，显示它
                if (comicConfig.pageNotes && comicConfig.pageNotes[index]) {
                    noteDiv.textContent = comicConfig.pageNotes[index];
                }
                
                pageWrapper.appendChild(pageNum);
                pageWrapper.appendChild(img);
                pageWrapper.appendChild(noteDiv);
                container.appendChild(pageWrapper);
            });
            
            // 添加碎碎念/后记区域（使用原版样式）
            const afterwordDiv = document.createElement('div');
            afterwordDiv.className = 'talk-section';
            
            const talkContentDiv = document.createElement('div');
            talkContentDiv.className = 'talk-content';
            
            // 如果有预设的碎碎念，显示它
            if (comicConfig.afterword && comicConfig.afterword.trim()) {
                talkContentDiv.innerHTML = comicConfig.afterword;
            } else {
                talkContentDiv.innerHTML = '<p>// Add your afterword here</p>';
            }
            
            afterwordDiv.appendChild(talkContentDiv);
            container.appendChild(afterwordDiv);
        });
    </script>
</body>
</html>
